name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'

    - name: Create bootstrap cache directory
      run: |
        mkdir -p bootstrap/cache
        mkdir -p storage/framework/cache
        mkdir -p storage/framework/sessions
        mkdir -p storage/framework/testing
        mkdir -p storage/framework/views
        mkdir -p storage/logs
        chmod -R 775 bootstrap storage
    - name: Install PHP dependencies
      run: |
        composer config --unset repositories || true
        composer install --no-progress --no-suggest --prefer-dist --ignore-platform-req=php

    - name: Validate composer.json
      run: composer validate --no-check-all

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Install npm dependencies
      run: npm install

    - name: Check PHP syntax errors
      run: |
        find ./app ./config ./database ./routes ./tests -name "*.php" -exec php -l {} \; 2>/dev/null || true
