server {
    listen 443 ssl;
    http2 on;

    server_name your.vexim.domain;

    # ── TLS ──────────────────────────────────────────────────────────────────
    ssl_certificate     /etc/dehydrated/certs/your.vexim.domain/fullchain.pem;
    ssl_certificate_key /etc/dehydrated/certs/your.vexim.domain/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;                  # drop TLS 1.0 / 1.1
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;                   # let TLS 1.3 pick freely
    ssl_dhparam /etc/nginx/ssl/dhparams.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    ssl_stapling off;
    ssl_stapling_verify off;

    # ── HTTP/3 advertisement ──────────────────────────────────────────────────
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Protocol $server_protocol always;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Tune the CSP below to match your app's actual needs
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self';" always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/your.vexim.domain.access.log;
    error_log  /var/log/nginx/your.vexim.domain.error.log warn;

    # ── Laravel root (public/) ────────────────────────────────────────────────
    root  /home/veximweb/vexim_web/public;
    index index.php;

    client_max_body_size 20M;

    # ── ACME / Let's Encrypt ──────────────────────────────────────────────────
    include /etc/nginx/snippets/letsencrypt.conf;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml
               application/rss+xml image/svg+xml;

    # ── Laravel front controller ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Laravel livewire  ─────  ──────────────────────────────────────────────
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────────────────────
    location ~ \.php$ {
        # Block direct access to PHP files outside the public root
        try_files $uri =404;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/vexim2026-84.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        include fastcgi_params;

        fastcgi_buffer_size          128k;
        fastcgi_buffers              4 256k;
        fastcgi_busy_buffers_size    256k;
        fastcgi_read_timeout         300;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Laravel storage / bootstrap cache — never serve directly ─────────────
    location ~* /(?:storage|bootstrap/cache)/.*\.php$ {
        deny all;
    }

    # ── Block hidden files and .env ───────────────────────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
