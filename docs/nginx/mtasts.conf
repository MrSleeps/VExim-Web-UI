# HTTP redirect server - catches all autodiscover subdomains
server {
    listen 80;
    listen [::]:80;
    server_name ~^mta-sts\.(?<domain>.+)$;

    return 301 https://$host$request_uri;
}

# HTTPS server - handles all autodiscover subdomains

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;
    server_name ~^mta-sts\.(?<domain>.+)$;

    ssl_certificate /etc/dehydrated/certs/mta-sts.your.domain/fullchain.pem;
    ssl_certificate_key /etc/dehydrated/certs/mta-sts.your.domain/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /var/log/websites/mta-sts.websites.access.log;
    error_log  /var/log/websites/mta-sts.websites.error.log warn;

    location /.well-known/mta-sts.txt {

        # ❌ DO NOT use $domain (not reliable)
        # ❌ DO NOT hardcode Host

        # ✅ Pass real host through
        proxy_set_header Host $host;

        # Keep original host for app logic
        proxy_set_header X-Original-Host $host;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header X-Original-URI $request_uri;

        proxy_pass https://your.veximweb.website/.well-known/mta-sts.txt;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
