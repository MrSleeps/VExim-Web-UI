# HTTP redirect server - catches all autodiscover subdomains
server {
    listen 80;
    listen [::]:80;
    server_name ~^autodiscover\.(?<domain>.+)$;
    # Preserve the original domain for the HTTPS redirect
    return 301 https://$host$request_uri;
}

# HTTPS server - handles all autodiscover subdomains
server {
    listen 443 ssl reuseport;
    listen [::]:443 ssl;
    http2 on;
    server_name ~^autodiscover\.(?<domain>.+)$;

    # Backend Laravel app this proxies to - change here only
    set $autodiscover_host "your.veximwebdomain.com";

    # SSL certificate
    # Note: It will NOT match autodiscover.otherdomain.com exactly, but nginx will still serve it
    ssl_certificate /etc/dehydrated/certs/autodiscover.your.veximwebdomain.com/fullchain.pem;
    ssl_certificate_key /etc/dehydrated/certs/autodiscover.your.veximwebdomain.com/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/websites/autodiscover.websites.access.log;
    error_log  /var/log/websites/autodiscover.websites.error.log warn;

    large_client_header_buffers 4 32k;
    client_header_buffer_size 32k;

    # Proxy to your Laravel app
    location /autodiscover/autodiscover.xml {
        # Extract the main domain from the autodiscover subdomain
        # e.g., autodiscover.your.veximwebdomain.com -> your.veximwebdomain.com
        set $main_domain $domain;

        # Proxy to the main domain's endpoint (assumes your Laravel app handles all)
        proxy_pass https://$autodiscover_host/autodiscover/autodiscover.xml;

        # Forward exim's real Host so nginx routes to the exim vhost, not back into this regex block
        proxy_set_header Host $autodiscover_host;
        # Pass the original autodiscover domain through so Laravel knows which domain was requested
        proxy_set_header X-Original-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_buffer_size 32k;
        proxy_buffers 4 64k;
        proxy_busy_buffers_size 64k;
        proxy_set_header Cookie "";

        # Pass the email parameter through
        proxy_set_header X-Original-URI $request_uri;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
