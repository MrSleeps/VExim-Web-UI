vexim {
    api_url = "https://your.vexim.domain";
    api_key = "";
    # HTTP request timeout (seconds)
    timeout = 2;
    
    # Cache TTL for user settings to avoid too many API calls (seconds)
    cache_ttl = 300;
    
    # Enable/disable the module
    enabled = true;

    skip_authenticated = true;  # Set to false if you want to check authenticated users too
    skip_local = true;          # Skip for local networks (127.0.0.1, etc.)

}
