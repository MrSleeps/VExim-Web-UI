symbol "IP_REPUTATION" {
    # This applies a positive score (bad) to negative reputation scores.
    # The default multiplier is usually sufficient.
    # Rspamd will multiply the internal reputation score by this weight.
    weight = 1.0;
}

symbol "HFILTER_URL_ONLY" { weight = 0.5; group = "hfilter"; }
symbol "HFILTER_HELO_5"   { weight = 1.0; group = "hfilter"; }
symbol "HFILTER_HOSTNAME_5" { weight = 1.0; group = "hfilter"; }
