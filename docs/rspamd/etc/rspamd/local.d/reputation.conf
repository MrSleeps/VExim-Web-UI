rules {
  ip_reputation = {
    # This selector tells Rspamd to track the connecting IP address
    selector "ip" {
      # Setting lower_bound to 20 means reputation is only applied after 20 messages
      lower_bound = 20;
      # This is where you set the network masks
      ipv4_mask = 24;
      ipv6_mask = 64;
      # This applies the reputation score to incoming mail
      inbound = true;
      # This prevents it from affecting outbound mail you send
      outbound = false;
    }

    # Redis is the standard and efficient backend for reputation
    backend "redis" {
      servers = "127.0.0.1:6379";
    }

    # This is the name of the symbol that will appear in the logs and scores
    symbol = "IP_REPUTATION";
  }
}
