  # Virus scanning is handled by Rspamd (ClamAV via antivirus module)
  # Legacy sophie/clamd native malware scan removed
  #
  # warn    message     = This message contains malware ($malware_name)
  #         malware     = *
  #         log_message = This message contains malware ($malware_name)

  # Reject messages with an "X-Spam-Flag: YES" header.
  #
  deny    message   = Sender openly considers message as spam (X-Spam-Flag header with a positive value was found).
          condition = ${if bool{$h_x-spam-flag:}{true}{false}}

  # Strip legacy spam headers from all messages before Rspamd adds its own.
  # Note: removed the 300k size bypass - Rspamd handles large messages fine.
  #
  warn    remove_header = X-Spam-Flag : X-Spam-Score : X-Spam-Status : X-Spam-Report

  # Conditional spam scanning based on SPAM_ENGINE macro
  #
  .ifdef SPAM_ENGINE_RSPAMD
      # ============================================
      # OUTBOUND MAIL HANDLING (Authenticated Users)
      # ============================================
      .ifdef SPAM_SCAN_OUTBOUND
          # SCAN OUTBOUND MAIL - Macro exists
          # Identify authenticated users
          warn   authenticated = *
                 control = no_enforce_sync

          # Scan with Rspamd, passing authenticated username
          warn   spam = ${if def:authenticated_id {$authenticated_id}{nobody}}:true
                 set acl_m_spam_action = $spam_action
                 set acl_m_spam_score = $spam_score
                 set acl_m_spam_bar = $spam_bar
                 set acl_m_spam_report = $spam_report
                 remove_header = X-Spam-Flag : X-Spam-Score : X-Spam-Status : X-Spam-Report
                 log_message = "Rspamd outbound scan: action=$spam_action score=$spam_score user=$authenticated_id"

          # Add warning header for suspicious outbound (but don't reject)
          warn   authenticated = *
                 condition = ${if match{$acl_m_spam_action}{add_header|soft reject}}
                 add_header = X-Spam-Warning: Outbound message flagged (score: $acl_m_spam_score)
                 log_message = "Outbound warning for $authenticated_id: $acl_m_spam_action score=$acl_m_spam_score"

          # ONLY reject outbound for critical (malware/high confidence)
          deny   authenticated = *
                 message = Outbound spam detected - possible account compromise. Please contact support.
                 condition = ${if eq{$acl_m_spam_action}{reject}}
                 log_message = "COMPROMISED ACCOUNT: $authenticated_id score=$acl_m_spam_score"

          # Allow all other authenticated mail after scanning
          accept authenticated = *
      .else
          # DON'T SCAN OUTBOUND MAIL - Just accept immediately (macro does NOT exist)
          accept authenticated = *
      .endif

      # ============================================
      # INBOUND MAIL (Unauthenticated) - Normal handling
      # ============================================
      # This code ONLY runs for unauthenticated (inbound) mail
      # because if authenticated, the accept above would have already matched
      
      # Scan with Rspamd for unauthenticated (inbound) mail
      warn   spam = nobody:true
             set acl_m_spam_action = $spam_action
             set acl_m_spam_score = $spam_score
             set acl_m_spam_bar = $spam_bar
             set acl_m_spam_report = $spam_report
             remove_header = X-Spam-Flag : X-Spam-Score : X-Spam-Status : X-Spam-Report
             log_message = "Rspamd inbound scan: action=$spam_action score=$spam_score"

      # Add headers for inbound spam
      warn   condition = ${if !eq{$acl_m_spam_action}{no action}}
             add_header = X-Spam-Flag: YES
             add_header = X-Spam-Score: $acl_m_spam_score ($acl_m_spam_bar)
             add_header = X-Spam-Report: $acl_m_spam_report
             add_header = X-Spam-Action: $acl_m_spam_action

      # Rewrite subject for inbound
      warn   condition = ${if eq{$acl_m_spam_action}{rewrite subject}}
             add_header = X-Spam-Subject: ***SPAM*** $h_subject
             remove_header = Subject
             add_header = Subject: ***SPAM*** $h_subject

      # Greylist inbound only
      defer  message = Please try again later
             condition = ${if match{$acl_m_spam_action}{greylist|soft reject}}

      # Reject inbound spam
      deny   message = This message has been rejected as spam (score: $acl_m_spam_score)
             condition = ${if eq{$acl_m_spam_action}{reject}}
  .endif

  .ifdef SPAM_ENGINE_SPAMASSASSIN
      warn  spam = spamd:/var/run/spamd.sock
            set acl_m_spam_score = $spam_score
            set acl_m_spam_bar = $spam_bar
            set acl_m_spam_report = $spam_report
            remove_header = X-Spam-Flag : X-Spam-Score : X-Spam-Status : X-Spam-Report

      warn  condition = ${if >{$spam_score_int}{50}}
            add_header = X-Spam-Flag: YES
            add_header = X-Spam-Score: $acl_m_spam_score ($acl_m_spam_bar)
            add_header = X-Spam-Report: $acl_m_spam_report

      deny  message = This message has been rejected as spam (score: $spam_score)
            condition = ${if >{$spam_score_int}{150}}
  .endif

  # Final accept rules - catch anything not already accepted
  accept hosts          = 127.0.0.1:+relay_from_hosts
  accept authenticated  = *
